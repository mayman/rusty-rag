[package]
name = "rag-infra"
description = "Infrastructure adapters for rag (SQLite, git, filesystem, lock, clock)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
dirs = "7.0.0"
rag-core = { version = "0.1.0", path = "../rag-core" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
