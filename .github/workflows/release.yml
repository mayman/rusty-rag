# Release pipeline for the `rag` CLI. Read docs/RELEASING.md for the full procedure.
#
# - Push of a tag `v*` (for example v0.1.0 or v0.2.0-rc.1): runs the CI workflow, builds
#   every target, creates a DRAFT GitHub Release, uploads the archives and SHA256SUMS,
#   checks the asset list, and then publishes the release.
# - workflow_dispatch: a dry run. Runs the CI workflow and builds every target, and uploads
#   the archives as workflow artifacts only. It never creates or changes a release.
#
# Action pins: the actions below are official GitHub actions at their current major
# version. The maintainer may pin each one to a full commit SHA (see docs/RELEASING.md).

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Least privilege by default. Only the release job gets write access. GH_TOKEN is set only
# on the steps that call gh.
permissions:
  contents: read

# One run per ref at a time. Dry runs on a branch may cancel an older dry run;
# release runs (tags) are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify version and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v4 # maintainer may pin to a full commit SHA
        with:
          persist-credentials: false

      - name: Resolve pinned toolchain
        run: rustup show

      - name: Read workspace version
        id: meta
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "rag-cli") | .version')"
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::Could not read the rag-cli version from cargo metadata." >&2
            exit 1
          fi
          echo "Workspace version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check tag matches workspace version
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          expected="v${VERSION}"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::Tag '$TAG' does not match the workspace version. The [workspace.package] version in the root Cargo.toml is '$VERSION', so the tag must be '$expected'. Bump the version, or push the matching tag." >&2
            exit 1
          fi
          echo "Tag $TAG matches workspace version $VERSION."

      - name: Check formatting
        run: cargo fmt --all -- --check

  ci:
    # The same checks as ci.yml (fmt, clippy, tests on Windows, macOS and Linux).
    # Runs on tag pushes and on dry runs; build waits for it.
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.target }}
    needs: [verify, ci]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            exe_suffix: ".exe"
            native: true
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            exe_suffix: ""
            native: true
          # Cross-compiled on the arm64 macOS runner; not executed here.
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
            exe_suffix: ""
            native: false
          # Built on glibc 2.35: runs on glibc 2.35 or newer.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: tar.gz
            exe_suffix: ""
            native: true
          # Built on glibc 2.39 (Ubuntu 24.04): runs on glibc 2.39 or newer only.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
            exe_suffix: ""
            native: true
    env:
      TARGET: ${{ matrix.target }}
      ARCHIVE_EXT: ${{ matrix.archive }}
      EXE_SUFFIX: ${{ matrix.exe_suffix }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v4 # maintainer may pin to a full commit SHA
        with:
          persist-credentials: false

      - name: Resolve pinned toolchain and add target
        run: |
          set -euo pipefail
          rustup show
          rustup target add "$TARGET"

      - name: Build release binary
        run: cargo build --release --locked -p rag-cli --target "$TARGET"

      - name: Smoke test (native targets only)
        if: matrix.native
        run: |
          set -euo pipefail
          bin="target/${TARGET}/release/rag${EXE_SUFFIX}"
          test -f "$bin"
          # Git Bash cannot pass a /tmp path to a native binary, so build the scratch
          # path from RUNNER_TEMP with forward slashes (valid on every OS).
          scratch="${RUNNER_TEMP//\\//}/rag-smoke-${TARGET}"
          rm -rf "$scratch"
          mkdir -p "$scratch/home"
          export RUSTY_RAG_HOME="$scratch/home"

          version_out="$("$bin" --version)"
          echo "$version_out"
          case "$version_out" in
            *" $VERSION"*) ;;
            *)
              echo "::error::rag --version printed '$version_out', expected version $VERSION." >&2
              exit 1
              ;;
          esac

          "$bin" list > "$scratch/list.json"
          cat "$scratch/list.json"
          node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$scratch/list.json"

      - name: Package archive and checksum
        run: |
          set -euo pipefail
          name="rag-${VERSION}-${TARGET}"
          dist="$PWD/dist"
          stage="$dist/stage/$name"
          rm -rf "$dist"
          mkdir -p "$stage"
          cp "target/${TARGET}/release/rag${EXE_SUFFIX}" "$stage/"
          cp README.md "$stage/"
          if [ -f LICENSE ]; then cp LICENSE "$stage/"; fi

          if [ "$ARCHIVE_EXT" = "zip" ]; then
            # PowerShell's Compress-Archive is present on every Windows runner; zip(1) is not guaranteed.
            stage_win="$(cygpath -w "$stage")"
            zip_win="$(cygpath -w "$dist/$name.zip")"
            powershell.exe -NoProfile -NonInteractive -Command "Compress-Archive -Path '${stage_win}\\*' -DestinationPath '${zip_win}' -Force"
          else
            tar -czf "$dist/$name.tar.gz" -C "$stage" .
          fi

          archive="$name.$ARCHIVE_EXT"
          cd "$dist"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          cat "$archive.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4 # maintainer may pin to a full commit SHA
        with:
          name: rag-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4 # maintainer may pin to a full commit SHA
        with:
          pattern: rag-*
          path: dist
          merge-multiple: true

      - name: Verify artifacts and write SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          for checksum in rag-*.sha256; do
            sha256sum -c "$checksum"
          done
          sha256sum rag-*.zip rag-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Check for an existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          err="$RUNNER_TEMP/gh-release-view.err"
          # Only a draft from an earlier run may be resumed. A published release is never changed.
          if view="$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>"$err")"; then
            if [ "$view" = "true" ]; then
              echo "Release $TAG is a draft from an earlier run; it will be resumed."
              echo "state=draft" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Release $TAG is already published. This workflow never changes a published release. Cut the next version instead (see docs/RELEASING.md)." >&2
              exit 1
            fi
          elif grep -qi 'not found' "$err"; then
            echo "No release $TAG yet; a draft will be created."
            echo "state=new" >> "$GITHUB_OUTPUT"
          else
            cat "$err" >&2
            echo "::error::Could not check whether release $TAG exists." >&2
            exit 1
          fi

      - name: Create the draft release
        if: steps.existing.outputs.state == 'new'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" --draft --title "$TAG" --generate-notes "${prerelease[@]}"

      - name: Upload assets to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.existing.outputs.state }}
        run: |
          set -euo pipefail
          cd dist
          assets=(rag-*.zip rag-*.tar.gz SHA256SUMS)
          # --clobber is allowed only when resuming a draft; it never applies to a published release.
          clobber=()
          if [ "$STATE" = "draft" ]; then
            clobber=(--clobber)
          fi
          gh release upload "$TAG" "${assets[@]}" "${clobber[@]}"

      - name: Verify the draft's asset list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected="$(cd dist && printf '%s\n' rag-*.zip rag-*.tar.gz SHA256SUMS | sort)"
          actual="$(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::The assets on the draft $TAG do not match the build outputs." >&2
            echo "Expected:" >&2
            echo "$expected" >&2
            echo "Found:" >&2
            echo "$actual" >&2
            echo "Delete the draft (gh release delete $TAG --yes, which keeps the tag) and re-run the workflow." >&2
            exit 1
          fi
          echo "Assets on $TAG:"
          echo "$actual"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false
          echo "Published $TAG."
