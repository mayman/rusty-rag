# Applies to rag-core only (clippy resolves clippy.toml from the crate directory).
# I/O, processes, and clocks enter through ports implemented in rag-infra.
disallowed-methods = [
    { path = "std::fs::read", reason = "file access belongs in rag-infra" },
    { path = "std::fs::read_to_string", reason = "file access belongs in rag-infra" },
    { path = "std::fs::read_dir", reason = "file access belongs in rag-infra" },
    { path = "std::fs::write", reason = "file access belongs in rag-infra" },
    { path = "std::fs::create_dir", reason = "file access belongs in rag-infra" },
    { path = "std::fs::create_dir_all", reason = "file access belongs in rag-infra" },
    { path = "std::fs::remove_file", reason = "file access belongs in rag-infra" },
    { path = "std::fs::remove_dir", reason = "file access belongs in rag-infra" },
    { path = "std::fs::remove_dir_all", reason = "file access belongs in rag-infra" },
    { path = "std::fs::copy", reason = "file access belongs in rag-infra" },
    { path = "std::fs::rename", reason = "file access belongs in rag-infra" },
    { path = "std::fs::metadata", reason = "file access belongs in rag-infra" },
    { path = "std::fs::canonicalize", reason = "file access belongs in rag-infra" },
    { path = "std::fs::File::open", reason = "file access belongs in rag-infra" },
    { path = "std::fs::File::create", reason = "file access belongs in rag-infra" },
    { path = "std::time::SystemTime::now", reason = "use the Clock port" },
    { path = "std::time::Instant::now", reason = "use the Clock port" },
]
disallowed-types = [
    { path = "std::process::Command", reason = "subprocesses belong in rag-infra (GitClient)" },
    { path = "std::fs::File", reason = "file access belongs in rag-infra" },
    { path = "std::fs::OpenOptions", reason = "file access belongs in rag-infra" },
]